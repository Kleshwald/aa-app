@if (items().length > 0) {
  <section class="att att--active" aria-label="Ждут ваших действий">
    <header class="att__head">
      <span class="att__title">
        <svg
          class="att__title-icon"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        Ждут ваших действий
      </span>
      <span class="att__count" aria-hidden="true">{{ items().length }}</span>
    </header>

    <ul class="att__list">
      @for (item of items(); track item.id) {
        <li class="att__item att__item--{{ item.source }}">
          <span class="att__tag">{{ sourceLabel(item.source) }}</span>
          <span class="att__body">
            <span class="att__item-title">{{ item.title }}</span>
            <span class="att__item-sub">{{ item.subtitle }}</span>
          </span>
          <a class="att__action" [routerLink]="item.route" (click)="navigated.emit()">
            {{ item.actionLabel }}
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </a>
        </li>
      }
    </ul>
  </section>
} @else if (!hideWhenEmpty()) {
  <section class="att att--empty" aria-label="Ждут ваших действий">
    <span class="att__empty">
      <svg
        class="att__empty-icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      Сейчас от вас ничего не ждут — всё под контролем.
    </span>
  </section>
}
