# Agent Academy API Contract
# Version 1.0
# Это источник правды для фронтенда (Angular) и бэкенда (1С).
# Изменения в API проходят через изменение этого файла.

openapi: 3.0.3
info:
  title: Agent Academy API
  version: 1.0.0
  description: |
    HTTP API для платформы Agent Academy.
    Реализуется в 1С через HTTP-сервисы.
    Потребляется Angular-фронтендом.

    Все ответы возвращаются в едином формате ApiResponse<T>.
    Все запросы (кроме /auth/login) требуют JWT в заголовке Authorization.

servers:
  - url: http://localhost:4200/api/v1
    description: Local development (с моками через HttpInterceptor)
  - url: https://staging-1c.agentacademy.ru/hs/api/v1
    description: Staging (тестовая 1С)
  - url: https://b2b.agentacademy.ru/hs/api/v1
    description: Production (реальная 1С)

security:
  - bearerAuth: []

# ───── COMPONENTS ─────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Общие схемы ───

    ApiResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          description: true при успехе, false при ошибке
        data:
          description: Данные ответа (тип зависит от endpoint)
          nullable: true
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
              description: Машиночитаемый код ошибки
            message:
              type: string
              example: "Заполните все обязательные поля"
              description: Человекочитаемое сообщение (на русском)
            details:
              type: object
              nullable: true
              description: Дополнительные детали (например, список полей с ошибками)
        meta:
          type: object
          nullable: true
          properties:
            page:
              type: integer
              example: 1
            pageSize:
              type: integer
              example: 20
            total:
              type: integer
              example: 142

    Pagination:
      type: object
      properties:
        page:
          type: integer
          default: 1
          minimum: 1
        pageSize:
          type: integer
          default: 20
          minimum: 1
          maximum: 100

    # ─── Доменные схемы ───

    Agent:
      type: object
      required: [id, fullName, email, status]
      properties:
        id:
          type: string
          format: uuid
        ikp:
          type: string
          description: Индивидуальный код продавца (например, "00531")
          example: "00531"
        fullName:
          type: string
          example: "Иванова Елена Викторовна"
        email:
          type: string
          format: email
          example: "ivanova@example.ru"
        phone:
          type: string
          example: "+79991234567"
        birthDate:
          type: string
          format: date
          example: "1976-04-15"
        gender:
          type: string
          enum: [male, female, unknown]
        region:
          type: string
          example: "Красноярский край"
        district:
          type: string
          example: "Минусинск"
        legalType:
          type: string
          enum: [individual, ip, sz, ul]
          description: ФЛ, ИП, СЗ, ЮЛ
        category:
          type: string
          example: "Категория 3"
        curatorName:
          type: string
          example: "Марченко Елена Георгиевна"
        joinDate:
          type: string
          format: date
        firstSaleDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [active, inactive, blocked]
        totalCommission:
          type: number
          format: float
          description: Общая сумма комиссии за всё время

    Policy:
      type: object
      required: [id, number, type, status, startDate, endDate]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: "РРР-12345678"
        type:
          type: string
          enum: [OSAGO, NS, TICK, MORTGAGE]
        status:
          type: string
          enum: [active, expired, cancelled, pending, processing]
        clientName:
          type: string
          example: "Петров Иван Сергеевич"
        clientPhone:
          type: string
          example: "+79991234567"
        vehicleInfo:
          $ref: '#/components/schemas/VehicleInfo'
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        premium:
          type: number
          format: float
          description: Стоимость полиса
        commission:
          type: number
          format: float
          description: Комиссия агента
        insuranceCompany:
          $ref: '#/components/schemas/InsuranceCompany'
        agentId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        cancellationReason:
          type: string
          nullable: true

    VehicleInfo:
      type: object
      properties:
        vin:
          type: string
          example: "XTA21099120123456"
        licensePlate:
          type: string
          example: "А123ВС99"
        year:
          type: integer
          example: 2018
        brand:
          type: string
          example: "ВАЗ"
        model:
          type: string
          example: "2110"
        power:
          type: number
          example: 76.5
        category:
          type: string
          enum: [B, C, D]

    OwnerInfo:
      type: object
      required: [fullName, birthDate]
      properties:
        fullName:
          type: string
          example: "Петров Иван Сергеевич"
        birthDate:
          type: string
          format: date
          example: "1985-06-15"
        licenseDate:
          type: string
          format: date
          example: "2010-08-20"
        passportSeries:
          type: string
          example: "4509"
        passportNumber:
          type: string
          example: "123456"
        kbm:
          type: number
          format: float
          description: Коэффициент бонус-малус
          example: 0.85

    InsuranceCompany:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          example: "РЕСО-Гарантия"
        shortName:
          type: string
          example: "РЕСО"
        logo:
          type: string
          format: uri
          nullable: true

    CalculationOffer:
      type: object
      required: [insuranceCompany, premium, commission]
      properties:
        insuranceCompany:
          $ref: '#/components/schemas/InsuranceCompany'
        premium:
          type: number
          description: Стоимость полиса
        commission:
          type: number
          description: Комиссия агента
        validUntil:
          type: string
          format: date-time
          description: До какого времени действительно предложение
        conditions:
          type: array
          items:
            type: string
          description: Особые условия
        recommendationScore:
          type: number
          minimum: 0
          maximum: 100
          description: Рекомендательный балл (для сортировки)
        canProceed:
          type: boolean
          description: Можно ли оформить полис на этих условиях

    UrgentAction:
      type: object
      required: [id, type, title, dueDate]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [prolongation, client_request, payment, document, other]
        title:
          type: string
          example: "Пролонгация Петров И.С. истекает завтра"
        description:
          type: string
        dueDate:
          type: string
          format: date-time
        priority:
          type: string
          enum: [low, medium, high, critical]
        relatedEntityId:
          type: string
          nullable: true
        relatedEntityType:
          type: string
          enum: [policy, client, request]
          nullable: true

    DashboardMetrics:
      type: object
      properties:
        monthlyEarnings:
          type: number
          description: Заработано в этом месяце (₽)
        monthlyEarningsChange:
          type: number
          description: Изменение % к прошлому месяцу
        activePolicies:
          type: integer
          description: Количество активных полисов
        activePoliciesChange:
          type: number
        monthlyRenewals:
          type: integer
          description: Пролонгаций в этом месяце
        urgentRenewals:
          type: integer
          description: Срочных пролонгаций (требуют действия)
        conversionRate:
          type: number
          description: Конверсия расчётов в полисы (%)
        conversionRateChange:
          type: number

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: "00531"
          description: ИКП агента или email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Срок жизни access token в секундах
        agent:
          $ref: '#/components/schemas/Agent'

    # ─── Case (единый автомат процессов: ВИ / расторжение / убыток / ошибка) ───
    # Источник: docs/knowledge/10a-status-model-processes.md (доска ПРОЦЕССЫ-АА, ревизия 2026-08-27).
    # Ядро (Белов): UI смотрит на phase + ballHolder + actionRequired, а НЕ на switch(status).
    # Сводит три модели репо (PolicyProcess, Deal, cancel.model) в один Case с оверлеями по kind.
    # Разведение словарей статусов агент/поддержка — P0-находка (см. §2 документа 10a).

    CaseKind:
      type: string
      description: Вид заявки (bounded context). error — сервисный тикет, пока не реализуется.
      enum: [change, cancel, loss, error]

    CaseStatus:
      type: string
      description: |
        Каноничный (машинный) статус — единый источник правды. Русские лейблы для агента и
        поддержки вычисляются из справочника по паре (status, роль) → agentStatusLabel /
        supportStatusLabel (напр. new = агенту "Проверка документов", поддержке "Новая").
        Оверлеи по виду: awaiting_payment/paid — только kind=change;
        under_review/signing/signed/settled и claim_* — только kind=loss.
      enum:
        - new              # агент: Проверка документов / поддержка: Новая
        - in_work          # В работе (показываем агенту — решение владельца 2026-08-27)
        - awaiting_docs    # Ожидаем документы (мяч у агента)
        - docs_uploaded    # Документы загружены (системный)
        - awaiting_payment # Ожидаем оплаты (только change)
        - paid             # Оплачен (только change, системный)
        - under_review     # На рассмотрении у СК (только loss)
        - signing          # Подписание соглашения (только loss)
        - signed           # Соглашение подписано (только loss)
        - settled          # Урегулирован (loss, терминал-успех)
        - done             # Готово (change/cancel, терминал-успех)
        - rejected         # Отказ (терминал-отказ; rejectReason — свободный текст)
        # --- оверлей претензии (только loss) ---
        - claim_filed          # Направлена претензия
        - claim_review         # Претензия на рассмотрении
        - claim_awaiting_docs  # Ожидаем документы по претензии
        - claim_docs_uploaded  # Документы загружены (претензия)
        - claim_signing        # Подписание соглашения по претензии
        - claim_signed         # Соглашение подписано (претензия)
        - claim_settled        # Претензия урегулирована (терминал-успех)
        - claim_rejected       # Отказ по претензии (терминал-отказ)

    CasePhase:
      type: string
      description: Обобщённая фаза — для UI-логики вместо switch по статусу.
      enum: [intake, in_progress, action_required, with_insurer, closed]

    CaseBallHolder:
      type: string
      description: Чей сейчас ход. Приходит флагом с бэкенда, фронт его не вычисляет.
      enum: [agent, support, insurer, client, none]

    CaseActor:
      type: string
      description: Автор события/комментария. system — авто-переход/авто-текст.
      enum: [agent, support, insurer, curator, system]

    CaseStatusEvent:
      type: object
      required: [status, at, actor]
      properties:
        status:
          $ref: '#/components/schemas/CaseStatus'
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/CaseActor'
        comment:
          type: string
          nullable: true
          description: Комментарий/сервисное сообщение к переходу.

    CaseActionRequired:
      type: object
      description: Заполнено ⇔ мяч у агента ⇔ заявка попадает в "Ждут ваших действий".
      required: [label, addressee]
      properties:
        label:
          type: string
          example: "Загрузите: СТС, водительское удостоверение"
        addressee:
          type: string
          description: К кому обращено действие (агент лично / клиент через агента).
          enum: [agent, client]

    CasePaymentDetails:
      type: object
      description: |
        Оверлей доплаты (только kind=change, статусы awaiting_payment/paid).
        Срок жизни ссылки НЕ храним и НЕ показываем (решение владельца 2026-08-27):
        только флаг paymentLinkStale + дисклеймер + подпроцесс перевыпуска ссылки.
      properties:
        surchargeAmount:
          type: number
          format: float
          description: Сумма доплаты за изменение (₽).
        paymentLink:
          type: string
          format: uri
          nullable: true
          description: Ссылка на доплату, которую агент передаёт клиенту.
        paymentLinkStale:
          type: boolean
          default: false
          description: true — ссылка помечена недействительной, нужен перевыпуск.
        reissueCount:
          type: integer
          default: 0
          description: Сколько раз ссылку перевыпускали.
        paymentConfirmed:
          type: boolean
          default: false
          description: Агент приложил подтверждение оплаты (→ статус paid).

    CaseLossDetails:
      type: object
      description: Оверлей убытка (только kind=loss). Поля с доски (карточка УУ).
      properties:
        claimNumber:
          type: string
          nullable: true
          description: Номер убытка (вместо "крупный убыток").
        claimType:
          type: string
          nullable: true
          description: Тип убытка (Первичный / Вторичный / Претензия).
          enum: [primary, secondary, complaint]
        claimSign:
          type: string
          nullable: true
          description: Признак убытка (ПВУ / Классика; РС и ГО).
          enum: [pvu, classic]
        inspectionType:
          type: string
          nullable: true
          description: Тип осмотра (Осмотр агентом / АО-НЭ клиента / Выездной осмотр).
          enum: [by_agent, client_independent, field]
        applicant:
          type: string
          nullable: true
          description: Кто заявляет убыток (Собственник / Представитель по доверенности).
          enum: [owner, representative]
        claimDate:
          type: string
          format: date
          nullable: true
          description: Дата заявления.
        insurerAgreementDate:
          type: string
          format: date
          nullable: true
          description: Дата соглашения от СК.
        agentAgreementDate:
          type: string
          format: date
          nullable: true
          description: Дата соглашения от агента.
        paymentDate:
          type: string
          format: date
          nullable: true
          description: Дата оплаты от СК.
        payoutAmount:
          type: number
          format: float
          nullable: true
          description: Сумма выплаты.
        hasComplaint:
          type: boolean
          default: false
          description: Открыта ветка претензии (статусы claim_*).

    CaseCancelDetails:
      type: object
      description: Оверлей расторжения (только kind=cancel).
      properties:
        refundAmount:
          type: number
          format: float
          nullable: true
          description: Сумма к возврату (может быть скорректирована СК).
        refundDueDate:
          type: string
          format: date
          nullable: true
          description: Ориентир выплаты (до 14 календарных дней).

    CaseDocument:
      type: object
      required: [id, name, uploadedAt, actor]
      properties:
        id:
          type: string
        name:
          type: string
        uploadedAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/CaseActor'

    Case:
      type: object
      required: [id, requestNumber, kind, status, phase, ballHolder, policyId, createdAt]
      properties:
        id:
          type: string
        requestNumber:
          type: string
          description: Сквозной номер заявки, как в 1С.
          example: "000012934"
        kind:
          $ref: '#/components/schemas/CaseKind'
        legalEntity:
          type: boolean
          default: false
          description: Оверлей ЮЛ (нужны подписанные с печатями документы для СК).
        status:
          $ref: '#/components/schemas/CaseStatus'
        agentStatusLabel:
          type: string
          description: Вычисляемый лейбл статуса для агента (внешний словарь).
          example: "Проверка документов"
        supportStatusLabel:
          type: string
          description: Вычисляемый лейбл статуса для поддержки (внутренний словарь).
          example: "Новая"
        phase:
          $ref: '#/components/schemas/CasePhase'
        ballHolder:
          $ref: '#/components/schemas/CaseBallHolder'
        actionRequired:
          allOf:
            - $ref: '#/components/schemas/CaseActionRequired'
          nullable: true
          description: Заполнено только когда мяч у агента.
        policyId:
          type: string
        policyNumber:
          type: string
          nullable: true
        holderName:
          type: string
          description: Страхователь (полное ФИО).
          example: "Иванов Иван Иванович"
        object:
          type: string
          description: Объект страхования (авто+госномер / «Здоровье» / «Недвижимость»).
        region:
          type: string
          nullable: true
          description: Регион страхователя (для очереди поддержки).
        insurerName:
          type: string
          nullable: true
        responsibleName:
          type: string
          nullable: true
          description: ФИО ответственного сотрудника поддержки.
        viaApi:
          type: boolean
          default: false
          description: Заявка пришла/обрабатывается через API СК (напр. Ренессанс).
        reasons:
          type: array
          items:
            type: string
          description: Коды причин изменения (для kind=change).
        rejectReason:
          type: string
          nullable: true
          description: Причина отказа — СВОБОДНЫЙ ТЕКСТ (решение владельца 2026-08-27, без справочника).
        createdAt:
          type: string
          format: date-time
        lastActionAt:
          type: string
          format: date-time
          description: Дата последнего движения (для сортировки и сигнала «Ждут действий»).
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/CaseStatusEvent'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CaseDocument'
        payment:
          allOf:
            - $ref: '#/components/schemas/CasePaymentDetails'
          nullable: true
          description: Оверлей доплаты (kind=change).
        loss:
          allOf:
            - $ref: '#/components/schemas/CaseLossDetails'
          nullable: true
          description: Оверлей убытка (kind=loss).
        cancel:
          allOf:
            - $ref: '#/components/schemas/CaseCancelDetails'
          nullable: true
          description: Оверлей расторжения (kind=cancel).

# ───── PATHS ─────

paths:
  # ─── Auth ───

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Авторизация агента
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Выход из системы (инвалидация токена)
      operationId: logout
      responses:
        '200':
          description: OK

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Обновление access token через refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Новый access token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          expiresIn:
                            type: integer

  # ─── Agent ───

  /agents/me:
    get:
      tags: [Agent]
      summary: Профиль текущего агента
      operationId: getCurrentAgent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Agent'

    patch:
      tags: [Agent]
      summary: Обновить профиль (контакты, настройки)
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Agent'

  # ─── Dashboard ───

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Все данные для главной страницы (одним запросом)
      operationId: getDashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          metrics:
                            $ref: '#/components/schemas/DashboardMetrics'
                          recentPolicies:
                            type: array
                            items:
                              $ref: '#/components/schemas/Policy'
                            maxItems: 5
                          urgentActions:
                            type: array
                            items:
                              $ref: '#/components/schemas/UrgentAction'
                            maxItems: 10

  # ─── Policies ───

  /policies:
    get:
      tags: [Policies]
      summary: Список полисов агента
      operationId: getPolicies
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expired, cancelled, pending]
        - name: type
          in: query
          schema:
            type: string
            enum: [OSAGO, NS, TICK, MORTGAGE]
        - name: insuranceCompanyId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Поиск по ФИО клиента, номеру полиса, номеру машины
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, premium, commission, endDate]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Policy'

  /policies/{id}:
    get:
      tags: [Policies]
      summary: Детали полиса
      operationId: getPolicy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Policy'

  /policies/{id}/cancel:
    post:
      tags: [Policies]
      summary: Расторжение полиса
      operationId: cancelPolicy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                comment:
                  type: string
      responses:
        '200':
          description: Расторжение инициировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /policies/{id}/prolong:
    post:
      tags: [Policies]
      summary: Пролонгация полиса (создание расчёта на основе старого)
      operationId: prolongPolicy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Создан расчёт для пролонгации
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          calculationId:
                            type: string

  # ─── Calculations (OSAGO) ───

  /calculations/osago:
    post:
      tags: [Calculations]
      summary: Расчёт ОСАГО (параллельный запрос ко всем 7 СК)
      operationId: calculateOsago
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle, owner]
              properties:
                vehicle:
                  $ref: '#/components/schemas/VehicleInfo'
                owner:
                  $ref: '#/components/schemas/OwnerInfo'
                additionalDrivers:
                  type: array
                  items:
                    $ref: '#/components/schemas/OwnerInfo'
                period:
                  type: integer
                  description: Срок страхования в днях
                  default: 365
      responses:
        '200':
          description: Расчёт выполнен
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          calculationId:
                            type: string
                          offers:
                            type: array
                            items:
                              $ref: '#/components/schemas/CalculationOffer'
                          failedCompanies:
                            type: array
                            items:
                              type: object
                              properties:
                                companyId:
                                  type: string
                                reason:
                                  type: string

  /calculations/{id}:
    get:
      tags: [Calculations]
      summary: Получить расчёт по ID
      operationId: getCalculation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /calculations/{id}/proceed:
    post:
      tags: [Calculations]
      summary: Оформить полис на основе выбранного предложения
      operationId: proceedWithCalculation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [insuranceCompanyId]
              properties:
                insuranceCompanyId:
                  type: string
      responses:
        '200':
          description: Полис создан (в статусе processing)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Policy'

  # ─── Insurance Companies ───

  /insurance-companies:
    get:
      tags: [InsuranceCompanies]
      summary: Список доступных страховых компаний
      operationId: getInsuranceCompanies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InsuranceCompany'

  # ─── Vehicles (справочник) ───

  /vehicles/brands:
    get:
      tags: [Vehicles]
      summary: Список марок автомобилей
      operationId: getVehicleBrands
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string

  /vehicles/models:
    get:
      tags: [Vehicles]
      summary: Модели по марке
      operationId: getVehicleModels
      parameters:
        - name: brandId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ─── Cases (процессы по договору: ВИ / расторжение / убыток / ошибка) ───
  # Единый автомат заявок. См. docs/knowledge/10a-status-model-processes.md.

  /cases:
    get:
      tags: [Cases]
      summary: Список заявок (процессов) — очередь агента / поддержки
      operationId: getCases
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/CaseKind'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CaseStatus'
        - name: ballHolder
          in: query
          description: Фильтр «чей мяч» (напр. agent — ждут действий агента).
          schema:
            $ref: '#/components/schemas/CaseBallHolder'
        - name: policyId
          in: query
          schema:
            type: string
        - name: responsibleName
          in: query
          schema:
            type: string
        - name: insurerName
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: viaApi
          in: query
          description: Показывать заявки, пришедшие через API СК.
          schema:
            type: boolean
        - name: search
          in: query
          description: Поиск по ФИО страхователя, ИКП, номеру полиса или номеру заявки.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Case'

    post:
      tags: [Cases]
      summary: Создать заявку (ВИ / расторжение / убыток / ошибка) по договору
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, policyId]
              properties:
                kind:
                  $ref: '#/components/schemas/CaseKind'
                policyId:
                  type: string
                reasons:
                  type: array
                  items:
                    type: string
                comment:
                  type: string
                formSnapshot:
                  type: object
                  description: Снимок формы (для последующей передачи в СК).
      responses:
        '200':
          description: Заявка создана
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Case'

  /cases/{id}:
    get:
      tags: [Cases]
      summary: Детали заявки (со статусной историей и оверлеями по виду)
      operationId: getCase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Case'

  /cases/{id}/documents:
    post:
      tags: [Cases]
      summary: Приложить документ к заявке
      operationId: uploadCaseDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Документ приложен, заявка обновлена
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Case'

  /cases/{id}/transition:
    post:
      tags: [Cases]
      summary: Перевести заявку в новый статус (смена состояния автомата)
      description: |
        Идемпотентный переход (Idempotency-Key — защита от двойного тапа на нестабильном 3G).
        При targetStatus=rejected/claim_rejected обязателен rejectReason (свободный текст).
        Перевыпуск ссылки на доплату (kind=change): targetStatus=awaiting_payment +
        reissuePaymentLink=true (сбрасывает paymentLinkStale, увеличивает reissueCount).
      operationId: transitionCase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Ключ идемпотентности write-операции.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetStatus]
              properties:
                targetStatus:
                  $ref: '#/components/schemas/CaseStatus'
                comment:
                  type: string
                rejectReason:
                  type: string
                  description: Обязателен при targetStatus=rejected/claim_rejected. Свободный текст.
                paymentLink:
                  type: string
                  format: uri
                  description: Новая ссылка при выдаче/перевыпуске доплаты.
                reissuePaymentLink:
                  type: boolean
                  description: true — перевыпуск ссылки на доплату.
      responses:
        '200':
          description: Статус изменён
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Case'
        '409':
          description: Недопустимый переход из текущего статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

# Endpoints, которые будут добавлены позже:
# - /clients (управление клиентами)
# - /commissions (детальная информация по комиссиям)
# - /support (создание обращений в поддержку)
# - /notifications (push-уведомления)
# - /reports (отчёты для агента)
